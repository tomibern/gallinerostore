# Cierra la issue padre (épica o spec) cuando se cierra su último sub-issue,
# y sigue subiendo: ticket → épica → spec. Lo hace en un loop porque los
# cierres hechos con GITHUB_TOKEN no disparan otros workflows.
name: Cerrar issues padre

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  close-parents:
    runs-on: ubuntu-latest
    steps:
      - name: Cerrar padres sin sub-issues abiertos
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          number="$NUMBER"
          while true; do
            parent=$(gh api graphql -F owner="$OWNER" -F repo="$REPO" -F number="$number" -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    parent { number state subIssuesSummary { total completed } }
                  }
                }
              }' --jq '.data.repository.issue.parent')
            if [ -z "$parent" ] || [ "$parent" = "null" ]; then
              echo "#$number no tiene padre."
              break
            fi
            parent_number=$(jq -r '.number' <<<"$parent")
            state=$(jq -r '.state' <<<"$parent")
            total=$(jq -r '.subIssuesSummary.total' <<<"$parent")
            completed=$(jq -r '.subIssuesSummary.completed' <<<"$parent")
            if [ "$state" != "OPEN" ] || [ "$completed" -lt "$total" ]; then
              echo "#$parent_number queda como está ($state, $completed/$total sub-issues cerrados)."
              break
            fi
            gh issue close "$parent_number" --repo "$OWNER/$REPO" --reason completed \
              --comment "Se cerraron todos sus sub-issues (el último, #$number)."
            number="$parent_number"
          done
